name: Release

# Build & publish an unsigned macOS DMG (Tauri) to a GitHub Release on a version tag.
# Bump package.json "version" and src-tauri/tauri.conf.json "version", then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The DMG is UNSIGNED (no signing identity on the runner), so a downloaded copy trips
# Gatekeeper until CI signing/notarization secrets are added. Signed + notarized builds
# are produced locally by `scripts/build-signed.sh` (pnpm tauri:build:signed).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build macOS app + DMG (unsigned)
        run: pnpm tauri:build
      - name: Publish DMG to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
