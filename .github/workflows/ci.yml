name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only builds and tests; fork PRs run untrusted code, so give the token nothing to spend.
permissions:
  contents: read

jobs:
  build-test:
    # macos-latest, not ubuntu: the Rust core (src-tauri) uses macOS-only tray/
    # window APIs and won't compile on Linux — the app itself is macOS-only (v1).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: cargo test (Rust core — owns launch-argument safety)
        run: cargo test --manifest-path src-tauri/Cargo.toml
