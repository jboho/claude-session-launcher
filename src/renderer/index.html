<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Launcher</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <div class="win">
    <div class="banner" id="claude-banner">⚠ Claude Code not found on your PATH — <a href="https://code.claude.com/docs" target="_blank" rel="noreferrer">install it</a>, or set a path in ⚙ Settings.</div>
    <div class="titlebar">
      <span class="name"><span class="mark">✳</span> Claude Launcher</span>
      <button class="gear" id="open-settings">⚙</button>
    </div>
    <div class="compose">
      <div class="group"><span class="glabel">Model</span><div class="row" id="g-model"></div></div>
      <div class="group"><span class="glabel">Mode</span><div class="row" id="g-mode"></div></div>
      <div class="group"><span class="glabel">Effort</span><div class="row" id="g-effort"></div></div>
    </div>
    <div class="cmd-field">
      <span class="glabel">Command</span>
      <input id="cmd" type="text" placeholder="optional prompt / slash-command to run on launch" />
    </div>
    <div class="preview"><span class="caret">▸</span><span id="preview"></span></div>
    <div class="actions">
      <button class="act launch" id="launch">Launch ⏎</button>
      <button class="act save" id="save">★ Save</button>
    </div>
    <div class="save-row" id="save-row">
      <input id="save-name" type="text" placeholder="Name this preset…" />
      <button class="act save" id="save-confirm">Save</button>
      <button class="act" id="save-cancel">✕</button>
    </div>
    <div class="lane-label">Presets — click to launch</div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="backdrop" id="backdrop">
    <div class="sheet">
      <h2>Settings</h2>
      <p class="sub">Global defaults. Presets keep their own working dir + command.</p>
      <div class="sfld"><label>Terminal</label><div class="seg" id="seg-terminal"></div></div>
      <div class="sfld"><label>Default working directory</label><input id="s-wd" type="text" placeholder="/absolute/path — blank = current" /></div>
      <div class="sfld"><label>Claude binary (optional)</label><input id="s-claude" type="text" placeholder="claude (auto-detected on PATH)" /></div>
      <div class="close"><button id="close-settings">Done</button></div>
    </div>
  </div>
  <div id="toast"></div>

  <script type="module" src="./panel.js"></script>
</body>
</html>
